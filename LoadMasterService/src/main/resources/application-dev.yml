# Chỉ máy dev (SPRING_PROFILES_ACTIVE=dev): tài khoản mẫu do các initializer @Profile("dev") tạo, và thanh toán giả lập.
# Cấu hình dùng chung cho mọi môi trường nằm ở application.yml.
app:
  bootstrap:
    admin:
      email: ${DEV_ADMIN_EMAIL}
      password: ${DEV_ADMIN_PASSWORD}
      full-name: ${DEV_ADMIN_FULL_NAME}
      # true: admin trong DB gắn với Keycloak khác thì gắn lại vào Keycloak đang nối (chỉ đổi keycloak_id, không xoá)
      relink: ${DEV_ADMIN_RELINK:false}
    dispatcher:
      email: ${DEV_DISPATCHER_EMAIL:dispatcher@loadmaster.local}
      password: ${DEV_DISPATCHER_PASSWORD:${DEV_ADMIN_PASSWORD}}
      full-name: ${DEV_DISPATCHER_FULL_NAME:LoadMaster Dispatcher}

# Máy dev chạy thanh toán giả lập (mock-checkout, bỏ kiểm chữ ký). Môi trường thật đặt VNPAY_MOCK=false
# hoặc không bật profile dev.
vnpay:
  mock: ${VNPAY_MOCK:true}
