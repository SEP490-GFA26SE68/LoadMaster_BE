spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/loadmaster
      client:
        registration:
          optimization-client:
            provider: keycloak
            client-id: loadmaster-backend-service
            client-secret: ${LOADMASTER_BACKEND_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - optimization.execute
          keycloak-admin-client:
            provider: keycloak
            client-id: loadmaster-user-admin-service
            client-secret: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/loadmaster/protocol/openid-connect/token
  datasource:
    url: jdbc:postgresql://localhost:5432/loadmaster
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMOTMN1}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRET1234567890ABCDEF}
  vnp-url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}
  mock: ${VNPAY_MOCK:true}


goong:
  api:
    key: ${GOONG_API_KEY:}
    base-url: https://rsapi.goong.io
    timeout-seconds: 10

