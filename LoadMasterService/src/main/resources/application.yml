# Không bật profile nào mặc định: Spring Boot tự đọc biến SPRING_PROFILES_ACTIVE. Máy dev đặt SPRING_PROFILES_ACTIVE=dev
# để tạo admin, công ty và dữ liệu mẫu (DevAdminInitializer, DevCompanyInitializer, DevOptimizationMockInitializer);
# chạy không đặt biến đó thì không ghi dữ liệu mẫu nào vào DB.
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_URL:http://localhost:8180}/realms/loadmaster
      client:
        registration:
          optimization-client:
            provider: keycloak
            client-id: loadmaster-backend-service
            client-secret: ${LOADMASTER_BACKEND_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - optimization.execute
          keycloak-admin-client:
            provider: keycloak
            client-id: loadmaster-user-admin-service
            client-secret: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_AUTH_URL:http://localhost:8180}/realms/loadmaster/protocol/openid-connect/token
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loadmaster}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    # Pooler Supabase dùng chung cả nhóm chỉ có khoảng 15 kết nối: giữ pool nhỏ, máy nào cần hơn thì đặt biến.
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    # Giữ bật có chủ ý: còn service không có @Transactional mà vẫn đi qua quan hệ lazy (ví dụ xuất nhãn PDF đọc
    # kiện → đơn → điểm giao), tắt là LazyInitializationException. Chỉ tắt khi đã rà hết các đường đọc đó.
    # Ghi rõ để Spring không cảnh báo lúc khởi động.
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  vnp-url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/webhook/vnpay-return}
  # true: bỏ kiểm chữ ký VNPay và mở /api/payment/mock-checkout (công ty đăng nhập tự đánh dấu giao dịch của mình đã trả).
  # Mặc định tắt; chỉ profile dev bật sẵn (application-dev.yml).
  mock: ${VNPAY_MOCK:false}


goong:
  api:
    key: ${GOONG_API_KEY:}
    base-url: https://rsapi.goong.io
    timeout-seconds: 10

# Chỉ mở /actuator/health, không trả chi tiết thành phần. Redis chỉ dùng cho mã đặt lại mật khẩu
# nên không làm health DOWN khi Redis vắng.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    oauth:
      client-id: loadmaster-web, loadmaster-mobile

app:
  security:
    qr-aes-secret: ${QR_AES_SECRET}
  # Tài khoản dùng thử không ký thoả thuận: luôn gắn cờ; xoá cứng sau 30 ngày chỉ khi bật cờ này (mặc định tắt).
  trial:
    hard-delete-enabled: ${TRIAL_HARD_DELETE_ENABLED:false}
  # Web app: origin được gọi API (CORS, ngăn bằng dấu phẩy) và địa chỉ dùng trong chuyển hướng sau thanh toán, email, hoá đơn.
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
    cors-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
  password:
    generator:
      upper: ${UPPER:ABCDEFGHIJKLMNOPQRSTUVWXYZ}
      lower: ${LOWER:abcdefghijklmnopqrstuvwxyz}
      digits: ${DIGITS:0123456789}
  brevo:
    api-key: ${BREVO_API_KEY}
    sender-email: ${BREVO_SENDER_EMAIL}
    sender-name: ${BREVO_SENDER_NAME:loadmaster}
    security:
      otp-hmac-secret: ${OTP_HMAC_SECRET}
