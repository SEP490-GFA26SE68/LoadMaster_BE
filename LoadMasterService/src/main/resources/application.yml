spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_URL:http://localhost:8180}/realms/loadmaster
      client:
        registration:
          optimization-client:
            provider: keycloak
            client-id: loadmaster-backend-service
            client-secret: ${LOADMASTER_BACKEND_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - optimization.execute
          keycloak-admin-client:
            provider: keycloak
            client-id: loadmaster-user-admin-service
            client-secret: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_AUTH_URL:http://localhost:8180}/realms/loadmaster/protocol/openid-connect/token
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loadmaster}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  vnp-url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/webhook/vnpay-return}
  # true: bỏ kiểm chữ ký VNPay và mở /api/payment/mock-checkout (ai cũng đánh dấu được giao dịch đã trả).
  # Mặc định tắt; chỉ profile dev bật sẵn (application-dev.yml).
  mock: ${VNPAY_MOCK:false}


goong:
  api:
    key: ${GOONG_API_KEY:}
    base-url: https://rsapi.goong.io
    timeout-seconds: 10

springdoc:
  swagger-ui:
    oauth:
      client-id: loadmaster-web, loadmaster-mobile

app:
  security:
    qr-aes-secret: ${QR_AES_SECRET}
