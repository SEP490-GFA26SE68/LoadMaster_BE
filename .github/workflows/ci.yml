name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loadmaster-service:
    name: LoadMasterService (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LoadMasterService
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Test chạy trên H2 với cấu hình src/test/resources/config/application.yml: không cần .env, Supabase hay Keycloak.
      # Test migration Flyway dựng PostgreSQL bằng Testcontainers (Docker có sẵn trên ubuntu-latest).
      - name: Test
        run: sh ./mvnw -B -ntp test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: LoadMasterService/target/surefire-reports
          retention-days: 7

  optimize-service:
    name: OptimizeService (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: OptimizeService
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OptimizeService/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Giá trị giả chỉ để nạp cấu hình; test dùng SQLite trong bộ nhớ. Test cần Keycloak hay DB thật mang mark integration.
      - name: Test
        env:
          DATABASE_URL: sqlite:///./pytest-ci.db
          KEYCLOAK_CLIENT_SECRET: ci-dummy
        run: python -m pytest -q -m "not integration"

  docker-images:
    name: Docker image (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: LoadMasterService
            image: loadmaster-service
          - service: OptimizeService
            image: optimize-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Chỉ build để bắt lỗi Dockerfile; không đẩy lên registry nào.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Check docker-compose.prod.yml
        if: matrix.service == 'LoadMasterService'
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
