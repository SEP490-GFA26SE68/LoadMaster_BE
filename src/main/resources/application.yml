spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/loadmaster
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# ── Keycloak service-to-service token (S3-06b) ─────────────────────────────
keycloak:
  auth-server-url: http://localhost:8180
  realm: loadmaster
  service-client:
    client-id: loadmaster-backend-service
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:changeme}

# ── Optimization Engine (FastAPI) connection (S3-06) ───────────────────────
optimization:
  engine:
    url: http://localhost:8000
    timeout-sec: 120